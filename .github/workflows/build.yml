name: Build Lunchbox303

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS universal (VST3 + AU)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Smoke-render WAV
        run: |
          cmake --build build --target lunchbox303_render --parallel 4
          ./build/lunchbox303_render sample_pattern.wav
          ls -la sample_pattern.wav

      - name: Stage plugins
        run: |
          mkdir -p dist
          # JUCE places artifacts under build/Lunchbox303_artefacts
          find build -type d -name "*.vst3" | while read d; do cp -R "$d" dist/; done
          find build -type d -name "*.component" | while read d; do cp -R "$d" dist/; done
          find build -name "Lunchbox303" -type f -perm -111 | head -5
          cp -f sample_pattern.wav dist/ 2>/dev/null || true
          ls -laR dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lunchbox303-macOS-universal
          path: |
            dist/**
            sample_pattern.wav
