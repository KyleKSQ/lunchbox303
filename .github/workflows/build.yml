name: Build Lunchbox303

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS universal (VST3 + AU)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Smoke-render WAV
        run: |
          cmake --build build --target lunchbox303_render --parallel 4
          ./build/lunchbox303_render sample_pattern.wav
          ls -la sample_pattern.wav

      - name: Stage plugins
        run: |
          mkdir -p dist
          find build -type d -name "*.vst3" | while read d; do
            name=$(basename "$d")
            rm -rf "dist/$name"
            cp -R "$d" "dist/$name"
          done
          find build -type d -name "*.component" | while read d; do
            name=$(basename "$d")
            rm -rf "dist/$name"
            cp -R "$d" "dist/$name"
          done
          ls -la dist
          find dist -maxdepth 2 -type d
          du -sh dist/*

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lunchbox303-macOS-universal
          path: |
            dist/
